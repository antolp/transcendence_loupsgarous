# Local PostgreSQL only. This does not deploy the web application.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: werewolf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: werewolf_dev
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werewolf -d werewolf_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
